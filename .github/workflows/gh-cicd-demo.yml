name: Terraform CI/CD

on:
  push:
    branches: [ dev, test, prod, main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ dev, test, prod, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      action:
        description: "Terraform action"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      version:
        description: "Optional release version/tag"
        required: false
        type: string

jobs:
  versioning:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      repo_version: ${{ steps.set-version.outputs.repo_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute repository version
        id: set-version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          echo "repo_version=$version" >> $GITHUB_OUTPUT
          echo "Repository version: $version"

  terraform:
    name: Terraform validate, plan, and deploy
    needs: versioning
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: Choose environment and action
        id: choose
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
            TERRAFORM_ACTION="${{ github.event.inputs.action }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET_ENV=prod
            TERRAFORM_ACTION=plan
          else
            branch="${GITHUB_REF#refs/heads/}"
            case "$branch" in
              dev) TARGET_ENV=dev; TERRAFORM_ACTION=plan ;;
              test) TARGET_ENV=test; TERRAFORM_ACTION=plan ;;
              prod) TARGET_ENV=prod; TERRAFORM_ACTION=plan ;;
              main) TARGET_ENV=dev; TERRAFORM_ACTION=plan ;;
              *) echo "Unsupported branch $branch" >&2; exit 1 ;;
            esac
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
          echo "TERRAFORM_ACTION=$TERRAFORM_ACTION" >> $GITHUB_ENV
          echo "REPO_VERSION=${{ needs.versioning.outputs.repo_version }}" >> $GITHUB_ENV
          echo "Selected environment: $TARGET_ENV"
          echo "Selected action: $TERRAFORM_ACTION"
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Prepare Terraform workspace
        working-directory: terraform
        run: |
          terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"
      - name: Terraform plan
        working-directory: terraform
        run: |
          VARFILE=""
          if [ -f "environments/$TARGET_ENV/terraform.tfvars" ]; then
            VARFILE="-var-file=environments/$TARGET_ENV/terraform.tfvars"
          fi
          terraform plan -input=false -out=tfplan $VARFILE -var="environment=$TARGET_ENV" -var="version=$REPO_VERSION"
      - name: Terraform apply
        if: env.TERRAFORM_ACTION == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
